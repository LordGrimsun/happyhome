<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="65%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#E2DCD3"/>
    </radialGradient>
    <linearGradient id="isoBase3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#C7D2FE" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#1E1B4B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad3)"/>
  <circle cx="1200" cy="500" r="450" fill="#6366F1" fill-opacity="0.2" filter="blur(60px)"/>

  <g transform="translate(1000, 500)" filter="url(#shadow3)">
    <!-- Base Platform -->
    <path d="M 0,160 L 380,20 L 380,80 L 0,220 Z" fill="#64748B"/>
    <path d="M 0,160 L -380,20 L -380,80 L 0,220 Z" fill="#475569"/>
    <polygon points="0,-120 380,20 0,160 -380,20" fill="url(#isoBase3)"/>

    <!-- Concentric Target Circles on floor -->
    <ellipse cx="0" cy="20" rx="160" ry="70" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
    <ellipse cx="0" cy="20" rx="80" ry="35" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.8"/>

    <!-- Floating Central Quartz Crystal / Prism (Center) -->
    <g transform="translate(0, -60)">
      <!-- Levitation Ring -->
      <ellipse cx="0" cy="80" rx="100" ry="40" fill="none" stroke="#4F46E5" stroke-width="3" opacity="0.7"/>
      <ellipse cx="0" cy="80" rx="60" ry="24" fill="#818CF8" fill-opacity="0.25"/>

      <!-- Giant Floating Faceted Monolith / Prism -->
      <!-- Left Facet -->
      <polygon points="0,-180 -70,-30 0,60" fill="url(#prismGrad)" stroke="#4F46E5" stroke-width="1.5"/>
      <!-- Right Facet -->
      <polygon points="0,-180 70,-30 0,60" fill="#C7D2FE" fill-opacity="0.6" stroke="#4F46E5" stroke-width="1.5"/>
      <!-- Top Center Crown Facet -->
      <polygon points="0,-180 -35,-30 0,60 35,-30" fill="#FFFFFF" fill-opacity="0.85" stroke="#6366F1" stroke-width="1.5"/>

      <!-- Refracted Light Fan across the stage -->
      <polygon points="0,-30 350,-120 380,-30 320,60" fill="url(#laserBeam)" fill-opacity="0.35"/>
      <line x1="0" y1="-30" x2="350" y2="-120" stroke="#818CF8" stroke-width="2" opacity="0.8"/>
      <line x1="0" y1="-30" x2="380" y2="-30" stroke="#06B6D4" stroke-width="2" opacity="0.8"/>
      <line x1="0" y1="-30" x2="320" y2="60" stroke="#10B981" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Lab Flasks and Optical Pillars (Left) -->
    <g transform="translate(-180, 0)">
      <polygon points="0,20 40,0 0,-20 -40,0" fill="#94A3B8"/>
      <rect x="-15" y="-90" width="30" height="90" fill="#CBD5E1"/>
      <circle cx="0" cy="-90" r="14" fill="#4F46E5"/>
      <line x1="0" y1="-90" x2="140" y2="-120" stroke="#6366F1" stroke-width="3" stroke-dasharray="4,4" opacity="0.7"/>
    </g>

    <!-- Measurement Nodes (Floating) -->
    <circle cx="80" cy="-240" r="6" fill="#6366F1"/>
    <circle cx="-120" cy="-180" r="5" fill="#818CF8"/>
    <line x1="0" y1="-240" x2="80" y2="-240" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
