<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="kBg" cx="62%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#EBE1D2"/>
    </radialGradient>
    <linearGradient id="copperPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="kShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#451A03" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#kBg)"/>
  <g transform="translate(1080, 520)" filter="url(#kShadow)">
    <!-- Base Island Kitchen Floor (Checkerboard/Tile Isometric) -->
    <path d="M 0,180 L 460,30 L 460,90 L 0,240 Z" fill="#8C705A"/>
    <path d="M 0,180 L -460,30 L -460,90 L 0,240 Z" fill="#6B5442"/>
    <polygon points="0,-140 460,30 0,180 -460,30" fill="#E8DBC8"/>
    <!-- Floor tiles -->
    <path d="M -230,-55 L 230,105 M -115,-98 L 345,62 M 115,-98 L -345,62 M 230,-55 L -230,105" stroke="#CBB9A0" stroke-width="2" opacity="0.6"/>

    <!-- Large Kitchen Counter Island -->
    <g transform="translate(0, 10)">
      <polygon points="0,-50 240,30 0,110 -240,30" fill="#D4A373"/>
      <path d="M -240,30 L 0,110 L 240,30 L 240,70 L 0,150 L -240,70 Z" fill="#99582A"/>
      <!-- Counter Surface Granite -->
      <polygon points="0,-60 230,20 0,95 -230,20" fill="#FDFBF7"/>

      <!-- Simmering Copper Boba Cauldrons -->
      <g transform="translate(-100, 0)">
        <ellipse cx="0" cy="20" rx="55" ry="28" fill="#78350F"/>
        <path d="M -55,20 L -55,-20 C -55,-60 55,-60 55,-20 L 55,20 Z" fill="url(#copperPot)"/>
        <!-- Simmering Brown Sugar Tapioca -->
        <ellipse cx="0" cy="-20" rx="50" ry="22" fill="#3D1D09"/>
        <!-- Boba pearls bubbling -->
        <circle cx="-15" cy="-22" r="6" fill="#1C0D02"/><circle cx="10" cy="-20" r="7" fill="#1C0D02"/>
        <circle cx="-2" cy="-28" r="5" fill="#1C0D02"/><circle cx="25" cy="-18" r="6" fill="#1C0D02"/>
        <!-- Steam plume -->
        <path d="M 0,-40 Q -20,-80 10,-120 Q -10,-160 20,-200" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6" filter="blur(2px)"/>
      </g>

      <g transform="translate(100, -30)">
        <ellipse cx="0" cy="20" rx="50" ry="25" fill="#78350F"/>
        <path d="M -50,20 L -50,-15 C -50,-55 50,-55 50,-15 L 50,20 Z" fill="url(#copperPot)"/>
        <ellipse cx="0" cy="-15" rx="46" ry="20" fill="#C68B59"/>
        <path d="M 0,-35 Q 20,-75 -10,-115 Q 10,-155 -10,-190" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="blur(2px)"/>
      </g>
    </g>

    <!-- Spice Jars and Tea Cannisters (Back shelf) -->
    <g transform="translate(-120, -110)">
      <rect x="-60" y="-30" width="120" height="40" fill="#7C69A5" rx="6"/>
      <ellipse cx="-35" cy="-30" rx="14" ry="7" fill="#D4A373"/><rect x="-49" y="-55" width="28" height="25" fill="#FAF5EF"/>
      <ellipse cx="5" cy="-30" rx="14" ry="7" fill="#D4A373"/><rect x="-9" y="-55" width="28" height="25" fill="#FAF5EF"/>
      <ellipse cx="45" cy="-30" rx="14" ry="7" fill="#D4A373"/><rect x="31" y="-55" width="28" height="25" fill="#FAF5EF"/>
    </g>
  </g>
</svg>
