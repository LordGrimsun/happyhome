<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad4" cx="65%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FAF5FF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#E5D9CC"/>
    </radialGradient>
    <linearGradient id="isoBase4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="50%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="elixirGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#E9D5FF" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#3B0764" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad4)"/>
  <!-- Celestial Violet Aura -->
  <circle cx="1180" cy="480" r="480" fill="#A855F7" fill-opacity="0.25" filter="blur(65px)"/>
  <circle cx="1180" cy="480" r="220" fill="#F59E0B" fill-opacity="0.2" filter="blur(40px)"/>

  <g transform="translate(1000, 500)" filter="url(#shadow4)">
    <!-- Base Platform -->
    <path d="M 0,160 L 380,20 L 380,80 L 0,220 Z" fill="#6B21A8"/>
    <path d="M 0,160 L -380,20 L -380,80 L 0,220 Z" fill="#581C87"/>
    <polygon points="0,-120 380,20 0,160 -380,20" fill="url(#isoBase4)"/>

    <!-- Concentric Tier 2 Pedestal -->
    <g transform="translate(0, 20)">
      <polygon points="0,-70 200,10 0,90 -200,10" fill="#FFFFFF"/>
      <path d="M -200,10 L 0,90 L 200,10 L 200,30 L 0,110 L -200,30 Z" fill="#DDD6FE"/>
    </g>

    <!-- Tier 3 Cylindrical Marble Altar -->
    <g transform="translate(0, -10)">
      <ellipse cx="0" cy="40" rx="90" ry="38" fill="#EDE9FE"/>
      <path d="M -90,40 L -90,-10 L 90,-10 L 90,40 Z" fill="#DDD6FE"/>
      <ellipse cx="0" cy="-10" rx="90" ry="38" fill="#FFFFFF" stroke="#C084FC" stroke-width="2"/>
    </g>

    <!-- Celestial Orbital Rings around the Bottle -->
    <g transform="translate(0, -120)">
      <ellipse cx="0" cy="0" rx="190" ry="55" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8,6" transform="rotate(-18)" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="160" ry="45" fill="none" stroke="#C084FC" stroke-width="2" transform="rotate(24)" opacity="0.7"/>
      <!-- Sparkling orbital stars -->
      <circle cx="150" cy="-50" r="5" fill="#FBBF24"/>
      <circle cx="-130" cy="40" r="4" fill="#FFFFFF"/>
      <circle cx="90" cy="70" r="6" fill="#C084FC"/>
    </g>

    <!-- The Hero Product: Iconic Sculptured Bottle -->
    <g transform="translate(0, -120)">
      <!-- Shadow on Altar -->
      <ellipse cx="0" cy="90" rx="55" ry="22" fill="#581C87" opacity="0.3" filter="blur(4px)"/>

      <!-- Bottle Base and Body -->
      <rect x="-45" y="-30" width="90" height="120" rx="20" fill="url(#elixirGold)"/>
      <rect x="-45" y="-30" width="90" height="120" rx="20" fill="url(#bottleGlass)" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Bottle Shoulder & Neck -->
      <path d="M -45,-10 C -45,-50 -20,-60 -20,-90 L 20,-90 C 20,-60 45,-50 45,-10 Z" fill="url(#bottleGlass)" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Gold Sculptured Cap / Stopper -->
      <rect x="-18" y="-120" width="36" height="30" rx="6" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
      <circle cx="0" cy="-125" r="10" fill="#FDE68A"/>

      <!-- Bottle Emblem / Label (Center Seal) -->
      <circle cx="0" cy="30" r="24" fill="#FFFFFF" fill-opacity="0.95" stroke="#F59E0B" stroke-width="2"/>
      <path d="M 0,16 L 8,24 L 0,44 L -8,24 Z" fill="#9333EA"/>

      <!-- Vertical Light Glint on Glass -->
      <line x1="-30" y1="-20" x2="-30" y2="70" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Ascending Star Dust -->
    <circle cx="0" cy="-280" r="3" fill="#FBBF24"/>
    <circle cx="40" cy="-320" r="4" fill="#C084FC"/>
    <circle cx="-50" cy="-350" r="3" fill="#FDE68A"/>
  </g>
</svg>
