<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="pBgM" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FCF9F3"/>
      <stop offset="50%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </radialGradient>
    <linearGradient id="cliffGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A56A44"/>
      <stop offset="60%" stop-color="#804D2D"/>
      <stop offset="100%" stop-color="#5E351C"/>
    </linearGradient>
    <linearGradient id="terraceGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7D08C"/>
      <stop offset="50%" stop-color="#6E9A52"/>
      <stop offset="100%" stop-color="#4B7036"/>
    </linearGradient>
    <linearGradient id="roofGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7BAE"/>
      <stop offset="100%" stop-color="#4B3A70"/>
    </linearGradient>
    <filter id="pShadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#443224" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#pBgM)"/>

  <g transform="translate(540, 800)" filter="url(#pShadowM)">
    <path d="M -420,-30 C -430,80 -330,210 -100,250 C 120,280 330,230 430,120 C 470,80 450,0 410,-90 L 410,-20 C 410,70 310,180 100,210 C -100,210 -300,120 -380,-20 Z" fill="url(#cliffGradM)"/>
    <ellipse cx="10" cy="40" rx="420" ry="200" fill="#E8DBC5"/>

    <!-- Terraced Rows -->
    <path d="M -160,20 Q -70,80 40,80 Q 90,70 110,30" fill="none" stroke="url(#terraceGradM)" stroke-width="26" stroke-linecap="round"/>
    <path d="M -170,-20 Q -80,40 20,40 Q 70,30 90,0" fill="none" stroke="url(#terraceGradM)" stroke-width="26" stroke-linecap="round"/>
    <path d="M -170,-60 Q -80,0 0,0 Q 50,-10 70,-30" fill="none" stroke="url(#terraceGradM)" stroke-width="26" stroke-linecap="round"/>

    <!-- Tea pickers -->
    <g transform="translate(-80, 10)">
      <polygon points="0,-16 10,-4 -10,-4" fill="#E6CA9C"/>
      <rect x="-6" y="-4" width="12" height="12" rx="3" fill="#7C69A5"/>
    </g>
    <g transform="translate(0, -20)">
      <polygon points="0,-16 10,-4 -10,-4" fill="#E6CA9C"/>
      <rect x="-6" y="-4" width="12" height="12" rx="3" fill="#7C69A5"/>
    </g>

    <!-- Cottage -->
    <g transform="translate(140, -80)">
      <polygon points="0,40 90,0 90,-55 0,-15" fill="#E8DEC8"/>
      <polygon points="0,40 -70,0 -70,-55 0,-15" fill="#FAF6EE"/>
      <polygon points="0,-90 100,-35 0,10 -100,-35" fill="url(#roofGradM)"/>
    </g>

    <!-- Lily Pond -->
    <g transform="translate(190, 80)">
      <ellipse cx="0" cy="0" rx="90" ry="40" fill="#7AAFA9"/>
      <circle cx="20" cy="-5" r="8" fill="#4B7036"/>
      <circle cx="40" cy="10" r="10" fill="#4B7036"/>
    </g>
  </g>
</svg>
