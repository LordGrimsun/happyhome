<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="peBg" cx="62%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#E7DAEB"/>
    </radialGradient>
    <radialGradient id="blossomGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </radialGradient>
    <filter id="peShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#581C87" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#peBg)"/>
  <g transform="translate(1080, 520)" filter="url(#peShadow)">
    <!-- Base Platform (Park Lawn & Paver Stones) -->
    <path d="M 0,180 L 460,30 L 460,90 L 0,240 Z" fill="#4D6B3C"/>
    <path d="M 0,180 L -460,30 L -460,90 L 0,240 Z" fill="#3B522E"/>
    <polygon points="0,-140 460,30 0,180 -460,30" fill="#99C17E"/>

    <!-- Stepping Stone Plaza -->
    <ellipse cx="20" cy="50" rx="200" ry="100" fill="#D7C2A3"/>

    <!-- Large Blooming Cherry Blossom Tree (Center Left) -->
    <g transform="translate(-140, -40)">
      <path d="M -15,80 Q 0,0 20,-60 Q -20,-110 0,-180" stroke="#5E4029" stroke-width="24" stroke-linecap="round" fill="none"/>
      <!-- Soft Pink Foliage Clouds -->
      <circle cx="-30" cy="-180" r="75" fill="url(#blossomGrad)" opacity="0.9"/>
      <circle cx="40" cy="-190" r="85" fill="url(#blossomGrad)" opacity="0.85"/>
      <circle cx="10" cy="-250" r="70" fill="#FBCFE8" opacity="0.95"/>
      <circle cx="-60" cy="-120" r="50" fill="url(#blossomGrad)" opacity="0.8"/>
      <circle cx="70" cy="-130" r="60" fill="url(#blossomGrad)" opacity="0.85"/>
      <!-- Falling petals -->
      <circle cx="30" cy="-70" r="5" fill="#F472B6"/><circle cx="90" cy="-40" r="4" fill="#F472B6"/><circle cx="-50" cy="20" r="5" fill="#F472B6"/>
    </g>

    <!-- Park Benches & Friends Sitting with Boba -->
    <g transform="translate(80, 40)">
      <!-- Wooden Bench (Isometric) -->
      <polygon points="-70,-10 30,-50 90,-25 -10,15" fill="#D4A373"/>
      <polygon points="-70,-10 -10,15 -10,25 -70,0" fill="#8C6541"/>
      <polygon points="-10,15 90,-25 90,-15 -10,25" fill="#6B472E"/>
      <!-- Bench Backrest -->
      <polygon points="-70,-40 30,-80 30,-50 -70,-10" fill="#D4A373"/>

      <!-- People silhouettes / Stylized characters -->
      <!-- Character 1 -->
      <g transform="translate(-20, -50)">
        <circle cx="0" cy="-24" r="12" fill="#7C69A5"/>
        <rect x="-10" y="-12" width="20" height="26" rx="6" fill="#F59E0B"/>
        <!-- Boba cup with straw -->
        <rect x="8" y="-6" width="7" height="12" rx="2" fill="#FAF5EF"/>
        <line x1="12" y1="-12" x2="12" y2="-4" stroke="#7C69A5" stroke-width="2"/>
      </g>
      <!-- Character 2 -->
      <g transform="translate(30, -70)">
        <circle cx="0" cy="-24" r="12" fill="#7C69A5"/>
        <rect x="-10" y="-12" width="20" height="26" rx="6" fill="#10B981"/>
        <rect x="-14" y="-6" width="7" height="12" rx="2" fill="#FAF5EF"/>
      </g>
    </g>
  </g>
</svg>
