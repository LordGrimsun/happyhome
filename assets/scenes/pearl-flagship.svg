<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="fBg" cx="62%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#F5F9FD"/>
      <stop offset="50%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#E5D9CB"/>
    </radialGradient>
    <linearGradient id="glassAwn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#1E3A8A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#fBg)"/>
  <g transform="translate(1080, 520)" filter="url(#fShadow)">
    <!-- Base Platform -->
    <path d="M 0,180 L 460,30 L 460,90 L 0,240 Z" fill="#64748B"/>
    <path d="M 0,180 L -460,30 L -460,90 L 0,240 Z" fill="#475569"/>
    <polygon points="0,-140 460,30 0,180 -460,30" fill="#E2E8F0"/>

    <!-- Flagship Shop Front -->
    <g transform="translate(0, -60)">
      <!-- Main Store Pavilion Wall -->
      <polygon points="0,90 200,10 200,-140 0,-60" fill="#FAF6EE" stroke="#334155" stroke-width="3"/>
      <polygon points="0,90 -220,10 -220,-140 0,-60" fill="#F1F5F9" stroke="#334155" stroke-width="3"/>

      <!-- Warm Sunlit Storefront Windows (Glass) -->
      <polygon points="-190,5 -30,65 -30,-45 -190,-105" fill="#E0F2FE" fill-opacity="0.7" stroke="#0284C7" stroke-width="2"/>
      <polygon points="30,65 170,10 170,-90 30,-35" fill="#E0F2FE" fill-opacity="0.7" stroke="#0284C7" stroke-width="2"/>

      <!-- Striped Cafe Awning (Purple & Cream) -->
      <polygon points="0,-60 220,-145 220,-115 0,-30" fill="#7C69A5"/>
      <polygon points="0,-60 -240,-145 -240,-115 0,-30" fill="#FAF5EF"/>
      <!-- Awning Valance -->
      <path d="M -240,-115 Q -120,-70 0,-30 Q 110,-75 220,-115 L 220,-100 Q 110,-60 0,-15 Q -120,-55 -240,-100 Z" fill="#7C69A5"/>

      <!-- Pearl & Co. Shop Signboard -->
      <g transform="translate(0, -80)">
        <polygon points="-60,-15 60,-15 50,15 -50,15" fill="#241D2B"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FAF5EF" text-anchor="middle">PEARL &amp; CO.</text>
      </g>

      <!-- Indoor Service Counter with Tea Taps & Boba Glasses -->
      <g transform="translate(0, 100)">
        <polygon points="0,-30 140,20 0,70 -140,20" fill="#B45309"/>
        <!-- Stainless steel tea towers -->
        <rect x="-40" y="-70" width="14" height="40" fill="#94A3B8" rx="4"/>
        <rect x="0" y="-70" width="14" height="40" fill="#CBD5E1" rx="4"/>
        <rect x="40" y="-70" width="14" height="40" fill="#94A3B8" rx="4"/>
      </g>
    </g>

    <!-- Outdoor Seating Stools -->
    <g transform="translate(-160, 110)">
      <ellipse cx="0" cy="0" rx="25" ry="12" fill="#D4A373"/>
      <line x1="-15" y1="0" x2="-15" y2="25" stroke="#475569" stroke-width="3"/>
      <line x1="15" y1="0" x2="15" y2="25" stroke="#475569" stroke-width="3"/>
    </g>
    <g transform="translate(180, 110)">
      <ellipse cx="0" cy="0" rx="25" ry="12" fill="#D4A373"/>
      <line x1="-15" y1="0" x2="-15" y2="25" stroke="#475569" stroke-width="3"/>
      <line x1="15" y1="0" x2="15" y2="25" stroke="#475569" stroke-width="3"/>
    </g>
  </g>
</svg>
