<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="65%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#EBE0CF"/>
    </radialGradient>
    <linearGradient id="isoBase2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4C3"/>
      <stop offset="100%" stop-color="#B2A08C"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="brassPipes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#451A03" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad2)"/>
  <circle cx="1200" cy="500" r="450" fill="#D97706" fill-opacity="0.22" filter="blur(60px)"/>

  <g transform="translate(1000, 500)" filter="url(#shadow2)">
    <!-- Base Platform -->
    <path d="M 0,160 L 380,20 L 380,80 L 0,220 Z" fill="#8C7764"/>
    <path d="M 0,160 L -380,20 L -380,80 L 0,220 Z" fill="#6B5949"/>
    <polygon points="0,-120 380,20 0,160 -380,20" fill="url(#isoBase2)"/>

    <!-- Brick foundation lines -->
    <path d="M -190,-50 L 190,90 M 190,-50 L -190,90" stroke="#C5B29B" stroke-width="2" opacity="0.6"/>

    <!-- Main Alembic Copper Still (Center) -->
    <g transform="translate(-20, 20)">
      <!-- Still Base Drum -->
      <ellipse cx="0" cy="40" rx="90" ry="45" fill="#78350F"/>
      <path d="M -90,40 L -90,-20 C -90,-80 -50,-120 0,-130 C 50,-120 90,-80 90,-20 L 90,40 Z" fill="url(#copperGrad)"/>
      <ellipse cx="0" cy="-20" rx="90" ry="30" fill="#D97706" opacity="0.5"/>

      <!-- Swan Neck Pipe curving across -->
      <path d="M 0,-130 C 0,-210 160,-240 180,-140 L 195,-140 C 175,-260 -20,-230 -20,-130 Z" fill="url(#brassPipes)"/>
      
      <!-- Condenser Column (Right) -->
      <g transform="translate(190, -100)">
        <rect x="-24" y="0" width="48" height="150" rx="10" fill="url(#copperGrad)"/>
        <!-- Ring accents -->
        <rect x="-28" y="25" width="56" height="8" rx="4" fill="#FBBF24"/>
        <rect x="-28" y="65" width="56" height="8" rx="4" fill="#FBBF24"/>
        <rect x="-28" y="105" width="56" height="8" rx="4" fill="#FBBF24"/>
      </g>

      <!-- Pressure Gauge & Valves -->
      <circle cx="-50" cy="-40" r="16" fill="#F5F5F4" stroke="#78350F" stroke-width="3"/>
      <line x1="-50" y1="-40" x2="-42" y2="-48" stroke="#DC2626" stroke-width="2"/>
    </g>

    <!-- Barrel Stacks (Left) -->
    <g transform="translate(-220, 30)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#92400E"/>
      <path d="M -40,0 L -40,-45 L 40,-45 L 40,0 Z" fill="#78350F"/>
      <ellipse cx="0" cy="-45" rx="40" ry="20" fill="#B45309"/>
      <line x1="-40" y1="-22" x2="40" y2="-22" stroke="#451A03" stroke-width="2"/>

      <ellipse cx="50" cy="-35" rx="35" ry="18" fill="#92400E"/>
      <path d="M 15,-35 L 15,-75 L 85,-75 L 85,-35 Z" fill="#78350F"/>
      <ellipse cx="50" cy="-75" rx="35" ry="18" fill="#D97706"/>
    </g>

    <!-- Rising Steam / Aroma Waves -->
    <path d="M -20,-160 C -40,-200 10,-240 -10,-290 C -30,-340 30,-380 0,-430" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="blur(2px)"/>
    <path d="M 10,-170 C -10,-210 40,-260 20,-310" fill="none" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
