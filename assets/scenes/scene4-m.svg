<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="mBg4" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FAF5FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#DFD2C4"/>
    </radialGradient>
    <linearGradient id="mBottleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="mSh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#3B0764" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#mBg4)"/>
  <circle cx="540" cy="800" r="380" fill="#A855F7" fill-opacity="0.22" filter="blur(50px)"/>
  <g transform="translate(540, 800)" filter="url(#mSh4)">
    <path d="M 0,160 L 360,20 L 360,75 L 0,215 Z" fill="#6B21A8"/>
    <path d="M 0,160 L -360,20 L -360,75 L 0,215 Z" fill="#581C87"/>
    <polygon points="0,-120 360,20 0,160 -360,20" fill="#E9D5FF"/>

    <!-- Altar -->
    <ellipse cx="0" cy="20" rx="90" ry="38" fill="#EDE9FE"/>
    <!-- Bottle -->
    <g transform="translate(0, -90)">
      <ellipse cx="0" cy="0" rx="160" ry="45" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="6,4" transform="rotate(-15)"/>
      <rect x="-42" y="-30" width="84" height="110" rx="18" fill="url(#mBottleGold)" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="-16" y="-80" width="32" height="26" rx="5" fill="#FBBF24"/>
      <circle cx="0" cy="-85" r="9" fill="#FDE68A"/>
    </g>
  </g>
</svg>
