<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="dBg" cx="62%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="50%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#EADDCB"/>
    </radialGradient>
    <filter id="dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#7C2D12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#dBg)"/>
  <g transform="translate(1080, 520)" filter="url(#dShadow)">
    <!-- Base Platform (Cobblestone Street) -->
    <path d="M 0,180 L 460,30 L 460,90 L 0,240 Z" fill="#78716C"/>
    <path d="M 0,180 L -460,30 L -460,90 L 0,240 Z" fill="#57534E"/>
    <polygon points="0,-140 460,30 0,180 -460,30" fill="#D6D3D1"/>

    <!-- Cobblestone Pattern -->
    <path d="M -230,-55 L 230,105 M 230,-55 L -230,105" stroke="#A8A29E" stroke-width="2" stroke-dasharray="8,6" opacity="0.7"/>

    <!-- Electric Delivery Trike / Scooter (Center) -->
    <g transform="translate(0, 10)">
      <!-- Wheels (Isometric Ellipses) -->
      <!-- Rear Left Wheel -->
      <ellipse cx="-80" cy="50" rx="20" ry="38" fill="#1C1917" stroke="#78716C" stroke-width="4"/>
      <!-- Rear Right Wheel -->
      <ellipse cx="60" cy="90" rx="20" ry="38" fill="#1C1917" stroke="#78716C" stroke-width="4"/>
      <!-- Front Wheel -->
      <ellipse cx="120" cy="-20" rx="18" ry="36" fill="#1C1917" stroke="#78716C" stroke-width="4"/>

      <!-- Trike Frame Chassis -->
      <polygon points="-80,30 60,70 120,-30 0,-70" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>

      <!-- Insulated Delivery Cooler Box (Purple & Mint) -->
      <g transform="translate(-30, -20)">
        <polygon points="0,50 90,15 90,-55 0,-20" fill="#7C69A5"/>
        <polygon points="0,50 -90,15 -90,-55 0,-20" fill="#9B7EBD"/>
        <polygon points="0,-20 90,-55 0,-90 -90,-55" fill="#B39DDB"/>
        <!-- Pearl & Co. Logo on Box -->
        <circle cx="0" cy="15" r="16" fill="#FAF5EF"/>
        <circle cx="0" cy="15" r="10" fill="#7C69A5"/>
      </g>

      <!-- Handlebars & Windshield -->
      <g transform="translate(80, -50)">
        <line x1="0" y1="0" x2="-20" y2="-40" stroke="#0F172A" stroke-width="4"/>
        <path d="M -30,-40 Q 0,-60 30,-40" stroke="#0F172A" stroke-width="4" fill="none"/>
        <ellipse cx="0" cy="-45" rx="18" ry="25" fill="#BAE6FD" opacity="0.7"/>
      </g>
    </g>

    <!-- Street Lantern / Light Post -->
    <g transform="translate(240, -40)">
      <rect x="-4" y="-120" width="8" height="160" fill="#1C1917"/>
      <ellipse cx="0" cy="-120" rx="16" ry="12" fill="#FDE047" opacity="0.9"/>
      <circle cx="0" cy="-120" r="30" fill="#FDE047" fill-opacity="0.25" filter="blur(8px)"/>
    </g>
  </g>
</svg>
