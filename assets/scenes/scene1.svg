<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="65%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#E8F5E9" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#EAE0D0"/>
    </radialGradient>
    <linearGradient id="isoBase1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D7C7"/>
      <stop offset="50%" stop-color="#D5C8B4"/>
      <stop offset="100%" stop-color="#B8A992"/>
    </linearGradient>
    <linearGradient id="glassRoof" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#A7F3D0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#4B4237" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad1)"/>

  <!-- Atmospheric mist circles -->
  <circle cx="1200" cy="520" r="420" fill="url(#glowG)" filter="blur(40px)"/>

  <!-- Diorama Floating Plinth (Isometric) -->
  <g transform="translate(980, 480)" filter="url(#shadow1)">
    <!-- Base Depth -->
    <path d="M 0,160 L 380,20 L 380,80 L 0,220 Z" fill="#9E8D76"/>
    <path d="M 0,160 L -380,20 L -380,80 L 0,220 Z" fill="#7D6D58"/>
    <!-- Top Island Surface -->
    <polygon points="0,-120 380,20 0,160 -380,20" fill="url(#isoBase1)"/>
    <!-- Isometric Grid lines -->
    <path d="M -190,-50 L 190,90 M -95,-85 L 285,55 M 95,-85 L -285,55 M 190,-50 L -190,90" stroke="#C5B6A0" stroke-width="2" opacity="0.6"/>

    <!-- Botanical Terrarium / Greenhouse Pavilion -->
    <!-- Pillars -->
    <line x1="-180" y1="10" x2="-180" y2="-180" stroke="#1F2937" stroke-width="4"/>
    <line x1="180" y1="10" x2="180" y2="-180" stroke="#1F2937" stroke-width="4"/>
    <line x1="0" y1="90" x2="0" y2="-110" stroke="#1F2937" stroke-width="5"/>
    <line x1="0" y1="-110" x2="0" y2="-280" stroke="#059669" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Arch Glass Structure -->
    <path d="M -180,-180 Q 0,-320 180,-180 L 0,-110 Z" fill="url(#glassRoof)" stroke="#10B981" stroke-width="2"/>
    <path d="M -180,10 L 0,90 L 180,10 L 180,-180 L 0,-110 L -180,-180 Z" fill="#A7F3D0" fill-opacity="0.12" stroke="#059669" stroke-width="1.5"/>

    <!-- Center Canopy Tree & Foliage -->
    <g transform="translate(0, 10)">
      <!-- Planter tub -->
      <polygon points="0,40 70,0 0,-40 -70,0" fill="#4B382A"/>
      <path d="M -70,0 L 0,40 L 70,0 L 70,25 L 0,65 L -70,25 Z" fill="#2E231A"/>

      <!-- Stylized Canopy & Leaves -->
      <path d="M 0,-10 C -20,-70 -80,-80 -90,-150 C -70,-180 -10,-190 0,-160 C 10,-190 70,-180 90,-150 C 80,-80 20,-70 0,-10 Z" fill="url(#stemGrad)"/>
      <circle cx="-45" cy="-140" r="32" fill="#34D399" opacity="0.85"/>
      <circle cx="45" cy="-140" r="35" fill="#10B981" opacity="0.9"/>
      <circle cx="0" cy="-175" r="42" fill="#6EE7B7" opacity="0.9"/>
      <circle cx="-25" cy="-105" r="28" fill="#059669" opacity="0.8"/>
      <circle cx="30" cy="-100" r="26" fill="#047857" opacity="0.85"/>
    </g>

    <!-- Side Botanical Specimen Domes -->
    <g transform="translate(-160, -40)">
      <ellipse cx="0" cy="0" rx="35" ry="18" fill="#C5B6A0"/>
      <path d="M -28,0 A 28 42 0 0 1 28 0 Z" fill="url(#glassRoof)" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="0" cy="-15" r="10" fill="#10B981"/>
    </g>

    <g transform="translate(160, -40)">
      <ellipse cx="0" cy="0" rx="35" ry="18" fill="#C5B6A0"/>
      <path d="M -28,0 A 28 42 0 0 1 28 0 Z" fill="url(#glassRoof)" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="0" cy="-15" r="12" fill="#059669"/>
    </g>

    <!-- Flight Guide Ray (Subtle vector depth track) -->
    <path d="M 0,-320 L 140,-420" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <circle cx="140" cy="-420" r="6" fill="#10B981" opacity="0.7"/>
  </g>
</svg>
