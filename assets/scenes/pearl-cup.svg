<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="cBg" cx="62%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#E2D4E8"/>
    </radialGradient>
    <linearGradient id="teaGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D1204"/>
      <stop offset="25%" stop-color="#854D0E"/>
      <stop offset="55%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FDE68A"/>
      <stop offset="90%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cupGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#E9D5FF" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#4C1D95" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#cBg)"/>
  
  <!-- Aura Glow -->
  <circle cx="1080" cy="500" r="420" fill="#A855F7" fill-opacity="0.2" filter="blur(60px)"/>
  <circle cx="1080" cy="500" r="220" fill="#F59E0B" fill-opacity="0.18" filter="blur(40px)"/>

  <g transform="translate(1080, 520)" filter="url(#cShadow)">
    <!-- Base Pedestal (Layered Wood Plinth) -->
    <path d="M 0,180 L 460,30 L 460,90 L 0,240 Z" fill="#6B21A8"/>
    <path d="M 0,180 L -460,30 L -460,90 L 0,240 Z" fill="#581C87"/>
    <polygon points="0,-140 460,30 0,180 -460,30" fill="#F3E8FF"/>

    <!-- Tier 2 Circular Coaster -->
    <ellipse cx="0" cy="30" rx="200" ry="85" fill="#E9D5FF"/>
    <ellipse cx="0" cy="20" rx="180" ry="75" fill="#FFFFFF" stroke="#C084FC" stroke-width="3"/>

    <!-- Orbital Gold Accent Ring -->
    <ellipse cx="0" cy="-60" rx="260" ry="80" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8,6" transform="rotate(-15)" opacity="0.8"/>
    <circle cx="210" cy="-120" r="6" fill="#FBBF24"/>
    <circle cx="-190" cy="0" r="5" fill="#FFFFFF"/>

    <!-- The Hero Cup (Center) -->
    <g transform="translate(0, -60)">
      <!-- Cup Body -->
      <path d="M -90,-160 L -65,110 Q 0,140 65,110 L 90,-160 Z" fill="url(#teaGradient)"/>
      <path d="M -90,-160 L -65,110 Q 0,140 65,110 L 90,-160 Z" fill="url(#cupGlass)" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Glossy Black Tapioca Pearls at Bottom -->
      <g transform="translate(0, 70)">
        <circle cx="-35" cy="15" r="14" fill="#1C0D02"/><circle cx="-32" cy="12" r="3" fill="#FFFFFF" opacity="0.6"/>
        <circle cx="0" cy="25" r="15" fill="#1C0D02"/><circle cx="3" cy="22" r="3" fill="#FFFFFF" opacity="0.6"/>
        <circle cx="35" cy="15" r="14" fill="#1C0D02"/><circle cx="38" cy="12" r="3" fill="#FFFFFF" opacity="0.6"/>
        <circle cx="-20" cy="-5" r="13" fill="#1C0D02"/><circle cx="-18" cy="-8" r="3" fill="#FFFFFF" opacity="0.6"/>
        <circle cx="15" cy="-2" r="14" fill="#1C0D02"/><circle cx="18" cy="-5" r="3" fill="#FFFFFF" opacity="0.6"/>
        <circle cx="-42" cy="-10" r="12" fill="#1C0D02"/>
        <circle cx="42" cy="-8" r="12" fill="#1C0D02"/>
      </g>

      <!-- Milk Marbling / Tea Swirls -->
      <path d="M -70,-20 Q -20,20 20,-30 Q 50,-60 75,-40" stroke="#FFFFFF" stroke-width="8" fill="none" opacity="0.75" filter="blur(2px)"/>
      <path d="M -60,30 Q 0,10 60,10" stroke="#FFFBEB" stroke-width="6" fill="none" opacity="0.8"/>

      <!-- Floating Ice Cubes -->
      <polygon points="-40,-110 -10,-130 20,-115 -10,-95" fill="#FFFFFF" fill-opacity="0.8" stroke="#E9D5FF" stroke-width="2"/>
      <polygon points="10,-80 40,-95 65,-80 35,-65" fill="#FFFFFF" fill-opacity="0.7" stroke="#E9D5FF" stroke-width="2"/>

      <!-- Branded Cup Emblem Seal -->
      <g transform="translate(0, -20)">
        <circle cx="0" cy="0" r="28" fill="#FFFFFF" fill-opacity="0.95" stroke="#7C69A5" stroke-width="2"/>
        <!-- Teapot icon inside seal -->
        <path d="M -10,-5 Q 0,-12 10,-5 L 12,8 Q 0,14 -12,8 Z" fill="#7C69A5"/>
        <ellipse cx="0" cy="-5" rx="8" ry="3" fill="#581C87"/>
        <circle cx="0" cy="-9" r="2.5" fill="#FBBF24"/>
      </g>

      <!-- Purple Dome Lid -->
      <ellipse cx="0" cy="-160" rx="92" ry="30" fill="#7C69A5" stroke="#581C87" stroke-width="2"/>
      <ellipse cx="0" cy="-165" rx="70" ry="22" fill="#9B7EBD"/>

      <!-- Wide Boba Straw (Angled) -->
      <g transform="translate(15, -165) rotate(16)">
        <rect x="-10" y="-120" width="20" height="260" rx="8" fill="#7C69A5" stroke="#581C87" stroke-width="2"/>
        <line x1="-3" y1="-120" x2="-3" y2="140" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>
